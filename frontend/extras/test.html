<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Admission Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #f5f5f5;
      font-family: 'Segoe UI', sans-serif;
    }

    .form-container {
      /* background: #fff; */
      padding: 30px;
      border-radius: 12px;
      /* box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); */
      max-width: 800px;
      margin: 0px auto;
    }

    /* Tabs styling */
    .nav-tabs .nav-link {
      border: none;
      border-bottom: 3px solid transparent;
      color: #555;
      font-weight: 500;
      transition: all 0.3s;
      padding: 10px 15px;
    }

    .nav-tabs .nav-link.active {
      color: #007bff;
      border-bottom: 3px solid #007bff;
      font-weight: 600;
    }

    .nav-tabs .nav-link:hover {
      color: #007bff;
    }

    .tab-pane {
      padding-top: 20px;
    }

    /* Square image upload box */
    .square-box {
      width: 180px;
      height: 180px;
      border: 2px dashed #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: 0 auto;
      transition: border 0.3s, background 0.3s;
    }

    .square-box:hover {
      border-color: #007bff;
      background: rgba(0, 123, 255, 0.05);
    }

    .square-box i {
      font-size: 40px;
      color: #aaa;
    }

    #studentImage {
      display: none;
    }

    .btn-next {
      float: right;
    }

    .preview-img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

  <div class="form-container">
    <div class="card border-0 shadow-sm rounded-4 p-4">
      <h2 class="text-center mb-4"> 🎓 Student Admission Form</h2>

      <!-- Tabs navigation -->
      <ul class="nav nav-tabs" id="admissionTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="image-tab" data-bs-toggle="tab" data-bs-target="#image" type="button"> 📷
            Image
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="personal-tab" data-bs-toggle="tab" data-bs-target="#personal" type="button">🧍
            Personal </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="qualification-tab" data-bs-toggle="tab" data-bs-target="#qualification"
            type="button"> 🎓 Qualification
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="admission-tab" data-bs-toggle="tab" data-bs-target="#admission" type="button"> 📝
            Admission
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="fee-tab" data-bs-toggle="tab" data-bs-target="#fee" type="button"> 💵 Fee
          </button>
        </li>
      </ul>

      <form id="admissionForm">
        <div class="tab-content">

          <!-- Tab 1: Image -->
          <div class="tab-pane fade show active" id="image" role="tabpanel">
            <div class="row align-items-center mt-4">
              <div class="col-md-6 text-center mb-3">
                <label for="studentImage" class="square-box">
                  <i class="fas fa-upload"></i>
                </label>
                <input type="file" id="studentImage" accept="image/*">
                <p class="mt-2">Click to upload image</p>
              </div>
              <div class="col-md-6 text-center">
                <img id="imgPreview" src="../demostdimg.jpg" alt="Student Image" class="preview-img mb-3">
                <div class="d-flex justify-content-center gap-2">
                </div>
              </div>
            </div>
            <button type="button" class="btn bg-white shadow-sm border btn-next mt-3 float-end">Next ➡️</button>
          </div>

          <!-- Tab 2: Personal -->
          <div class="tab-pane fade" id="personal" role="tabpanel">
            <div class="row g-3 mt-3">
              <div class="col-md-6">
                <label class="form-label">👤 Name</label>
                <input type="text" class="form-control" name="name" placeholder="Enter Name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label"> 👨‍👦 Father Name</label>
                <input type="text" class="form-control" name="fatherName" placeholder="Enter Father Name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label"> 🪪 CNIC</label>
                <input type="text" class="form-control" name="cnic" placeholder="Enter CNIC" required>
              </div>
              <div class="col-md-6">
                <label class="form-label"> 🎂 DOB</label>
                <input type="date" class="form-control" name="dob" placeholder="Select Date of Birth" required>
              </div>
              <div class="col-md-6">
                <label class="form-label"> 📞 Contact</label>
                <input type="text" class="form-control" name="contact" placeholder="Enter Contact Number" required>
              </div>
              <div class="col-md-6">
                <label class="form-label"> 📧 Email</label>
                <input type="email" class="form-control" name="email" placeholder="Enter Email">
              </div>
              <div class="col-md-6">
                <label class="form-label"> 🚻 Gender</label>
                <select class="form-control" name="gender">
                  <option value="">Select Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label"> 📍 Address</label>
                <textarea class="form-control" name="address" rows="2" placeholder="Enter Address"></textarea>
              </div>
            </div>
            <button type="button" class="btn bg-white shadow-sm border btn-next mt-3 float-end">Next ➡️</button>
          </div>

          <!-- Tab 3: Qualification -->
          <div class="tab-pane fade" id="qualification" role="tabpanel">
            <div class="row g-3 mt-3">
              <div class="col-md-6">
                <label class="form-label"> 🎓 Last Qualification</label>
                <input type="text" class="form-control" name="lastQualification" placeholder="Enter Last Qualification"
                  required>
              </div>
              <div class="col-md-6">
                <label class="form-label">🏫 Last School</label>
                <input type="text" class="form-control" name="lastSchool" placeholder="Enter Last School Name" required>
              </div>
            </div>
            <button type="button" class="btn bg-white shadow-sm border btn-next mt-3 float-end">Next ➡️</button>
          </div>

          <!-- Tab 4: Admission -->
          <div class="tab-pane fade" id="admission" role="tabpanel">
            <div class="row g-3 mt-3">

              <div class="col-md-6">
                <label class="form-label">📅 Admission Date</label>
                <input type="date" class="form-control" name="admissionDate" placeholder="Select Admission Date"
                  required>
              </div>

              <div class="col-md-6">
                <label class="form-label">✅ Status</label>
                <div>
                  <input type="radio" name="status" id="available" value="active" checked>
                  <label for="available" class="me-3">Active</label>

                  <input type="radio" name="status" id="left" value="left">
                  <label for="left">Left</label>
                </div>

                <div class="mt-2" id="leaveReasonBox" style="display: none;">
                  <label for="leaveReason">📄 Leave Reason</label>
                  <input type="text" name="leftReason" id="leaveReason" class="form-control"
                    placeholder="Enter reason for leaving">
                </div>
              </div>

              <div class="col-md-12" id="campusDropdownField"></div>

              <div class="col-12 mt-3">
                <label class="form-label">📚 Select Admission Type</label><br>

                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" name="admissionType" value="school">
                  <label class="form-check-label">School</label>
                </div>

                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" name="admissionType" value="tuition">
                  <label class="form-check-label">Tuition</label>
                </div>

                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" name="admissionType" value="computer">
                  <label class="form-check-label">Computer Class</label>
                </div>

                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" name="admissionType" value="english">
                  <label class="form-check-label">English Language</label>
                </div>
              </div>

              <!-- Dynamic fields -->
              <div class="row g-3 mt-3" id="classSectionFields" style="display: none;">
                <div class="col-md-6">
                  <label>🏷️ Admission Class</label>
                  <select name="class" id="admissionClass" class="form-select">
                    <option value="">Select Class</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label>🗂️ Admission Section</label>
                  <select name="section" id="admissionSection" class="form-select">
                    <option value="">Select Section</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label>📘 Current Class</label>
                  <select name="class" id="currentClass" class="form-select">
                    <option value="">Select Current Class</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label>🗂️ Current Section</label>
                  <select name="section" id="currentSection" class="form-select">
                    <option value="">Select Current Section</option>
                  </select>
                </div>
              </div>

              <div class="row g-3 mt-3" id="tuitionFields" style="display: none;">
                <div class="col-md-6">
                  <label>📗 Tuition Class</label>
                  <select name="tuitionClass" id="tuitionClass" class="form-select">
                    <option value="">Select Tuition Class</option>
                  </select>
                </div>
              </div>

              <div class="mt-3" id="computerCourseField" style="display: none;">
                <label>💻 Computer Course</label>
                <select name="computerCourse" id="computerCourse" class="form-select">
                  <option value="">Select Course</option>
                </select>
                <br>
                <label>🕒 Batch</label>
                <select name="computerCourseBatch" id="computerCourseBatch" class="form-select">
                  <option value="">Select Batch</option>
                </select>
              </div>

              <div class="mt-3" id="engCourseField" style="display: none;">
                <label>🗣️ English Course</label>
                <select name="englishCourse" id="englishCourse" class="form-select">
                  <option value="">Select Course</option>
                </select>
                <br>
                <label>🕒 Batch</label>
                <select name="engCourseBatch" id="engCourseBatch" class="form-select">
                  <option value="">Select Batch</option>
                </select>
              </div>
            </div>

            <button type="button" class="btn bg-white shadow-sm border btn-next mt-3 float-end">Next ➡️</button>
          </div>


          <!-- Tab 5: Fee -->
          <div class="tab-pane fade" id="fee" role="tabpanel">
            <div class="row g-3 mt-3">
              <div class="col">

                <h5 class="mb-3">🧾 Fee Info</h5>
                <label class="fw-bold">💰 Total Amount:</label>

                <input type="number" class="form-control mt-2" disabled id="totalFee" name="totalFee">

                <div id="Fee-info">
                </div>


              </div>
            </div>
            <button type="submit" class="btn border shadow-sm  mt-5 float-end"> 🚀 Submit
              </button>


          </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <!-- axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</body>

</html>
