<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Receipt 🧾</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../index.css">
  <style>
    .receipt-container {
      border: 1px solid #000;
      padding: 15px;
      border-radius: 10px;
      background: #fff;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h2 {
      font-weight: bold;
      text-transform: uppercase;
    }

    .section-title {
      font-weight: 600;
      background: #f5f5f5;
      padding: 5px 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
      margin-top: 10px;
    }

    .table th,
    .table td {
      padding: 6px;
      font-size: 14px;
    }

    .footer {
      margin-top: 30px;
      text-align: right;
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }

      .print-btn {
        display: none;
      }

      .nav-tabs {
        display: none;
      }

      /* hide tabs on print */
    }

    /* small spacing for cards inside tabs */
    .tab-card {
      margin-bottom: 15px;
    }

    .minimalist-input {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px;
    }
  </style>
</head>

<body id="body" class="bg-light">
  <div class="container-fluid px-0">
    <div id="navContent"></div>

    <div class="row flex-nowrap">
      <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar d-md-block d-none">
        <h4>Admin Panel 🛠️</h4>
        <nav id="sidebar d-md-block d-none" class="nav flex-column"></nav>
      </div>

      <div class="col  main-content">
        <div class="container">
          <div id="alertBox" class="mt-3"></div>

          <!-- Campus (shown when isSuperAdmin true) - position must not change -->
          <div class="row">
            <div class="col-12">
              <div class="row gx-2 align-items-end">
                <div class="col-md-4" id="campusWrap" style="display:none;">
                  <label class="form-label">🏫 Campus</label>
                  <select id="campusSelect" class="form-select minimalist-input"></select>
                </div>
                <!-- (optionally left space for other controls on same row) -->
              </div>
            </div>
          </div>

          <!-- TABS START -->
          <ul class="nav nav-tabs " id="receiptTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="create-tab" data-bs-toggle="tab" data-bs-target="#create"
                type="button" role="tab" aria-controls="create" aria-selected="true">
                🧾 Create Receipt
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="get-tab" data-bs-toggle="tab" data-bs-target="#get" type="button" role="tab"
                aria-controls="get" aria-selected="false">
                🔎 Get Receipt
              </button>
            </li>
          </ul>

          <div class="tab-content " id="receiptTabsContent">
            <!-- CREATE RECEIPT TAB -->
            <div class="tab-pane fade show active" id="create" role="tabpanel" aria-labelledby="create-tab">
              <div class="card shadow p-4 tab-card">
                <!-- <h3 class="mb-3 text-center">🧾 Create Receipt</h3> -->

                <!-- Step 1: Search Voucher -->
                <div class="row mb-3">
                  <div class="col-md-4">
                    <label class="form-label">🔢 Voucher No</label>
                    <input type="text" id="voucherNo" class="form-control minimalist-input"
                      placeholder="Enter voucher number">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">📚 Fee Type</label>
                    <select id="feeType" class="form-select minimalist-input">
                      <option value="">Select Fee Type</option>
                      <option value="school">School</option>
                      <option value="tuition">Tuition</option>
                      <option value="computer">Computer</option>
                      <option value="english">English</option>
                    </select>
                  </div>
                  <div class="col-md-4 d-flex align-items-end">
                    <button id="getVoucherBtn" class="btn btn-primary w-100">🔍 Get Voucher</button>
                  </div>
                </div>

                <hr>

                <!-- Step 2: Voucher Details -->
                <div id="voucherDetails" class="d">
                  <div class="row">
                    <div class="col-md-6 border-end">
                      <h5 class="mb-3">🎓 Student & Voucher Details</h5>

                      <div class="row mb-2">
                        <div class="col-md-4">
                          <label class="form-label">👤 Student</label><br>
                          <span id="studentName" class="form-control-plaintext fw-semibold"></span>
                        </div>

                        <div class="col-md-4">
                          <label class="form-label">👨‍👦 Father Name</label><br>
                          <span id="fatherName" class="form-control-plaintext fw-semibold"></span>
                        </div>

                        <div class="row mb-2">
                          <div class="col-md-6">
                            <label class="form-label">📊 Previous Due Total</label><br>
                            <span id="previousDueTotal" class="form-control-plaintext fw-semibold"></span>
                          </div>

                          <div class="col-md-6">
                            <label class="form-label">🧾 Current Month Total</label><br>
                            <span id="currentMonthTotal" class="form-control-plaintext fw-semibold"></span>
                          </div>



                        </div>
                      </div>
                      </div>
                      <div class="col-md-6">
                        <!-- Step 3: Payment Options -->
                        <h5 class="mb-3">💰 Select Total Payable Option</h5>

                        <div class="form-check mb-2">
                          <input class="form-check-input" type="radio" name="payableOption" id="withinDueDate" checked>
                          <label class="form-check-label" for="withinDueDate">
                            Total Payable (Within Due Date): <strong id="payableWithin">0</strong>
                          </label>
                        </div>

                        <div class="form-check mb-3">
                          <input class="form-check-input" type="radio" name="payableOption" id="afterDueDate">
                          <label class="form-check-label" for="afterDueDate">
                            Total Payable (After Due Date): <strong id="payableAfter">0</strong>
                          </label>
                        </div>
                      </div>

                    </div>







                    <!-- Step 4: Payment Details -->
                    <h5 class="mb-3">💵 Payment Details</h5>

                    <div class="row mb-3">
                      <div class="col-md-4">
                        <label class="form-label">💸 Amount Paying</label>
                        <input type="number" id="amount" class="form-control" placeholder="Enter amount">
                      </div>

                      <div class="col-md-4">
                        <label class="form-label">🏦 Payment Method</label>
                        <select id="paymentMethod" class="form-select">
                          <option value="">Select Method</option>
                          <option value="Cash">Cash</option>
                          <option value="Bank">Bank</option>
                          <option value="Easypaisa">Easypaisa</option>
                        </select>
                      </div>

                      <div class="col-md-4">
                        <label class="form-label">📝 Note (optional)</label>
                        <input type="text" id="note" class="form-control">
                      </div>
                    </div>

                    <div class="mb-3">
                      <label class="form-label fw-bold">⚖️ Remaining Balance</label>
                      <input type="text" id="balance" class="form-control fw-bold text-danger" readonly>
                    </div>

                    <div class="text-end">
                      <button id="saveReceiptBtn" class="btn btn-success">💾 Save Receipt</button>
                    </div>
                  </div>

                </div> <!-- card -->
              </div> <!-- create tab -->

              <!-- GET RECEIPT TAB -->
              <div class="tab-pane fade" id="get" role="tabpanel" aria-labelledby="get-tab">
                <div class="card shadow bg-white p-5 tab-card">
                  <h3 class="mb-3 text-center">🧾 Get Receipt</h3>

                  <div class="row">
                    <div class="col-md-4">
                      <label class="form-label">🔢 GrNo</label>
                      <input type="text" id="receiptNo" class="form-control" placeholder="Enter student grno">
                    </div>

                    <div class="col-md-4">
                      <label class="form-label">📚 Fee Type</label>
                      <select id="feeTypeforSingle" class="form-select">
                        <option value="">Select Fee Type</option>
                        <option value="school">School</option>
                        <option value="tuition">Tuition</option>
                        <option value="computer">Computer</option>
                        <option value="english">English</option>
                      </select>
                    </div>

                    <div class="col-md-3">
                      <label class="form-label">📅 Month</label>
                      <input id="monthInput" type="month" class="form-control" required>
                    </div>

                    <div class="col-md-3">
                      <label class="form-label">🗓 Session</label>
                      <input type="text" id="sessionforSingle" class="form-control" placeholder="e.g. 2025-26">
                    </div>

                    <div class="col-md-4 d-flex align-items-end mt-3">
                      <button id="getReceiptBtn" class="btn btn-primary w-100">🔍 Get Receipt</button>
                    </div>
                  </div>

                  <!-- area to render fetched receipt details (function renderReceiptDetails can append) -->
                  <div id="singleReceiptRender" class="mt-4"></div>
                </div> <!-- card -->
              </div> <!-- get tab -->
            </div> <!-- tab-content -->

            <!-- COMMON PRINT BUTTON (Option A) -->
            <div class="d-flex justify-content-end mt-3">
              <button class="btn btn-warning print-btn" onclick="printReceipt()">🖨️ Print</button>
            </div>

          </div> <!-- container -->
        </div> <!-- main-content -->
      </div> <!-- row -->
    </div> <!-- container-fluid -->

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../global.js"></script>
    <script src="receipt.js"></script> <!-- your existing logic -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../index.js"></script>

    <script>
      // small helpers to keep UX nice (no logic changes)
      // ensure campusWrap visibility logic from your receipt.js still works
      // And keep existing event listeners — this just ensures tabs don't interfere.
      document.addEventListener('DOMContentLoaded', () => {
        // If your receipt.js relies on DOMContentLoaded, it will run as well.
        // No extra JS needed here; printReceipt() should be present in receipt.js.
      });
    </script>
</body>

</html>
