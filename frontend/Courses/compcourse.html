<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💻 Dashboard - Computer Course Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../index.css">
  <style>
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1055;
    }
  </style>
</head>
<body>
  <div class="container-fluid px-0">
        <div id="navContent"></div>

    <div class="row flex-nowrap">
      <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar d-md-block d-none">
        <h4>🛠 Admin Panel</h4>
        <nav id="sidebar d-md-block d-none" class="nav flex-column"></nav>
      </div>
           <div class="col  main-content ">
        
        <div class="row ">
          <div class="col bg-white  p-3 p-md-5 border rounded-3">
            <h2 class="mb-5 text-center">💻 Add Computer Course</h2>

            
        <div class="row align-items-center gy-3">
              <div class="col-md-3 col-12">
            <button class="btn btn-success " data-bs-toggle="modal" data-bs-target="#courseModal"> ➕ Add New Course</button>

              </div>
              <div class="col-md-3 col-6">
                <label for="">🔍 Enter Name</label>
                <input type="text" class="form-control" placeholder="Search by Course Name" id="searchCourse">
              </div>
              <div class="col-md-3 col-6" id="campusSelectBox1">
                
              </div>
            </div>

            <div class="table-responsive mt-3">
              <table class="table table-bordered table-hover" id="courseTable">
                <thead class="table-light">
                  <tr>
                    <th>#️⃣</th>
                    <th>📚 Course Name</th>
                    <th id="adminth" style="display: none;">🏫 Campus</th>
                    <th>⚙️ Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="courseModal" tabindex="-1">
    <div class="modal-dialog  modal-dialog-centered">
      <div class="modal-content">
        <form id="courseForm">
          <div class="modal-header">
            <h5 class="courseModalLabel" id="courseModalLabel">➕ Add New Course</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">📚 Course Name</label>
              <input type="text" class="form-control minimalist-input" id="courseName" placeholder="Enter course name" required>
            </div>
            <div>
            <div id="campusSelectBox2"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-dark" id="addCourseButton">💾 Add Course</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container">
    <div class="toast text-white border-0" id="toastMessage">
      <div class="d-flex">
        <div class="toast-body" id="toastBody">📢 Message</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../global.js"></script>
  <script src="./compCourse.js"></script>
  <script src="../index.js"></script>
  <script src="../dropdown.js"></script>

</body>
</html>
