<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voucher Print</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../index.css">
  <style>
    .voucher-slip {
      border: 1px solid #ddd;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      background: #fff;
    }

    .voucher-slip h5 {
      margin-bottom: 10px;
    }

    .voucher-slip table {
      width: 100%;
    }
  </style>
</head>

<body class="bg-light">
  <div class="container-fluid px-0">

    <div id="navContent">
    </div>

    <div class="row flex-nowrap">
      <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar d-md-block d-none">
        <!-- <h4>Admin Panel</h4> -->
        <nav id="sidebar d-md-block d-none" class="nav flex-column"></nav>
      </div>
      <div class="col main-content">
        <div class="container my-4">

          <div class="card p-3 p-md-5 mb-4">
            <h3 class="mb-5 text-center">🧾 Voucher Print</h3>

            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label">💰 Fee Type</label>
                <select id="feeType" class="form-select">
                  <option value="">Select</option>
                  <option value="school">🏫 School</option>
                  <option value="tuition">📚 Tuition</option>
                  <option value="computer">💻 Computer</option>
                  <option value="english">📖 English</option>
                </select>
              </div>
              <div class="col">

                  <label class="form-label">Selection Type</label>
                  <div class="d-flex gap-3">

                    </div>

                      <label class="form-check-label" for="sel_course">Course Wise</label>
                    </div>

<div class="col-12">
  <label class="form-label">Selection Type</label>
  <select class="form-select" id="selectionTypeSelect">
    <option id="singleWiseBox" value="single" selected>Single</option>
    <option id="ClassWiseBox" value="class">Class Wise</option>
    <option id="CourseWiseBox" value="course">Course Wise</option>
    <option id="BatchWiseBox" value="batch">Batch Wise</option>
    <option id="AllWiseBox" value="all">All</option>
  </select>
</div>

              </div>

              <!-- Campus (shown when isSuperAdmin true) -->
              <div class="col-md-4" id="campusWrap" style="display:none;">
                <label class="form-label">🏫 Campus</label>
                <select id="campusSelect" class="form-select"></select>
              </div>

              <!-- Class (shown for school) -->
              <div class="col-md-4" id="classWrap" style="display: none;">
                <label class="form-label">🏷 Class</label>
                <select id="classSelect" class="form-select"></select>
              </div>

              <!-- Coaching classes -->
              <div class="col-md-4" id="coachingClassesWrap" style="display:none;">
                <label class="form-label">📚 Coaching Class</label>
                <select id="coachingClassSelect" class="form-select"></select>
              </div>

              <!-- Course & Batch (computer) -->
              <div class="col-md-4" id="compcourseWrap" style="display:none;">
                <label class="form-label">💻 Course</label>
                <select id="courseSelect" class="form-select"></select>
              </div>

              <div class="col-md-4" id="engcourseWrap" style="display:none;">
                <label class="form-label">📖 Eng Course</label>
                <select id="engcourseSelect" class="form-select"></select>
              </div>

              <!-- Computer Course Batch -->
              <div class="col-md-4" id="computerBatchWrap" style="display:none;">
                <label class="form-label">💻 Computer Batch</label>
                <select id="computerCourseBatchSelect" class="form-select"></select>
              </div>

              <!-- English Course Batch -->
              <div class="col-md-4" id="englishBatchWrap" style="display:none;">
                <label class="form-label">📖 English Batch</label>
                <select id="engCourseBatchSelect" class="form-select"></select>
              </div>

              <div class="col-md-3" id="grnoWrap">
                <label class="form-label">🆔 Student GR No</label>
                <input type="text" id="grNo" class="form-control" placeholder="e.g. 1234">
              </div>
              <div class="col-md-3">
                <label class="form-label">📅 Month</label>
                <input type="month" id="month" class="form-control" placeholder="e.g. October">
              </div>


              <div class="col-ld-3 col-md-4 col-6 align-self-end">
                <button class="btn btn-primary w-100" id="fetchBtn">🔍 Fetch </button>
              </div>

              <div class="col-ld-3 col-md-4 col-6  align-self-end">
                <button class="btn btn-danger w-100" id="deleteBtn">🗑 Delete </button>
              </div>

              <div class="col-ld-3 col-md-4 col-6  align-self-end">
                <button class="btn bg-dark text-white w-100" id="printBtn">🖨️ Print</button>
              </div>
              <div class="col-ld-3 col-md-4 col-6 ">
                <!-- Trigger Button -->
                <button type="button" id="edit" class="btn bg-success text-white  w-100">
                  ✏ Edit Voucher
                </button>
              </div>


            </div>
          </div>



          <div id="voucherContainer"></div>
        </div>
         <div class="container">
          <div class="card mb-4 p-3">
            <div class="card-body">
              <!-- <h4 class="mb-4"> Students </h4> -->
              <div class="table-responsive">
                <table class="table table-bordered text-center">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>F Name</th>
                      <th>GR No</th>
                      <th>Status</th>
                      <th colspan="2">Action</th>
                    
                    </tr>
                  </thead>
                  <tbody id="resultsTableBody">
                    <!-- Results will be appended here -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
      </div>
      </div>
      
    </div>
    
  </div>
  <div class="modal fade" id="editVoucherModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="editVoucherModalLabel">Edit Voucher</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div class="row ">
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label">Show Arrears</label>
                <div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="showArrears" id="showArrearsYes" value="yes">
                    <label class="form-check-label" for="showArrearsYes">Yes</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="showArrears" id="showArrearsNo" value="no"
                      >
                    <label class="form-check-label" for="showArrearsNo">No</label>
                  </div>
                </div>
              </div>

            </div>
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label">Monthly Fee</label>
                <input type="number" id="monthlyFee" class="form-control" />
              </div>
            </div>

              <div class="col-md-4">
                <div class="mb-3">
                  <label class="form-label">Late Fee</label>
                  <input type="number" id="lateFee" class="form-control" />
                </div>

              </div>
              <div class="col-md-3">
    <label for="issueDate" class="form-label">Issue Date</label>
    <input type="date" id="issueDate" class="form-control" />
  </div>

  <!-- Due Date -->
  <div class="col-md-3">
    <label for="dueDate" class="form-label">Due Date</label>
    <input type="date" id="dueDate" class="form-control" />
  </div>

  <!-- Expire Date -->
  <div class="col-md-3">
    <label for="expireDate" class="form-label">Expire Date</label>
    <input type="date" id="expireDate" class="form-control" />
  </div>
            </div>
          


            <h5 class="mt-4">Extras</h5>

            <!-- Extras Table -->
            <table class="table table-bordered mt-2" id="extrasTable">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Amount</th>
                  <th width="80">Action</th>
                </tr>
              </thead>
              <tbody id="extrasBody"></tbody>
            </table>

            <button class="btn btn-sm btn-primary" id="addExtraBtn">➕ Add Extra</button>

            <hr>

            <h5>Total Amount: <span id="totalAmount">0</span></h5>
            <h5>Total + Late Fee: <span id="grandTotal">0</span></h5>

          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button class="btn btn-success" onclick="saveVoucher()">💾 Save Changes</button>
          </div>

        </div>
        
      </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./printVoucher.js"></script>
    <script src="../index.js"></script>
</body>

</html>
