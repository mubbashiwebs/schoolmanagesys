<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Structure Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            background: var(--bg-card);
            max-width: 1100px;
            margin: auto;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Top Bar Layout */
        .grid-header {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, select {
            height: 44px;
            padding: 0 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            transition: all 0.2s;
            background-color: #fff;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            /* box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); */
        }

        /* Classes Row Layout */
        #ClassContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .class-card {
            background: #fdfdfd;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            transition: transform 0.2s;
        }

        .class-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .class-card label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .feeInput {
            width: 100% !important;
            height: 38px !important;
            border: 1px solid #d1d5db !important;
            font-weight: 600;
            color: var(--primary);
            box-sizing: border-box;
        }

        /* Save Button */
        .btn-save {
            margin-top: 10px !important;
            background: var(--success);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-save:hover { opacity: 0.9; }

        .section-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* --- Table Styles --- */
        .table-container {
            margin-top: 40px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .btn-delete , .btn-cancel {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-delete:hover { opacity: 0.8; }
        /* Edit Button - Blue Theme */
.btn-edit {
    background-color: #eef2ff;
    color: #4f46e5;
   border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
}

.btn-edit:hover {
    background-color: #4f46e5;
    color: white;
}
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fa-solid fa-receipt"></i> Fee Structure Management</h2>

    <div class="grid-header">
        <div class="form-group" id="campusSelectBox2">
            <!-- <div id=""></div> -->
        </div>

        <div class="form-group">
            <label>Fee Structure Name</label>
            <input type="text" id="feeName" placeholder="e.g. Annual Fee 2025-26">
        </div>
    </div>

    <div class="section-title">Class Wise Monthly Fees</div>
    <div id="ClassContainer">
        <p style="color: var(--text-muted); font-size: 0.9rem;">Please select a campus to load classes...</p>
    </div>
    <button class="btn btn-cancel" style="display: none;" onclick="cancel()">Cancel</button>
    <button class="btn btn-save" onclick="saveFeeStructure()">
        <i class="fa-solid fa-floppy-disk"></i> Save Fee Structure
    </button>
<hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

    <div class="section-title">Existing Fee Structures</div>
       

           <div class=""  id="campusSelectBox1"></div>
           <br>
           <input type="text" id="search" placeholder="Search By name">

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Structure Name</th>
                    
                    <th style="text-align: center;" colspan="2">Action</th>
                </tr>
            </thead>
            <tbody id="feeTableBody">
                </tbody>
        </table>
    </div>
</div>
    
</div>



<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="../global.js"></script>

    const isSuperAdmin = user[0]?.designation === "supremeadmin";
    
   

</script>
<script src="feeStructure.js"></script>
<script src="../dropdown.js"></script>
</body>
</html>
