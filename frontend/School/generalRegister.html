<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Dashboard - GR Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../index.css">
    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

    <style>
       .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1055;
    }
    </style>
    <style>
  
</style>
</head>

<body>
  
<div class="container-fluid px-0">

  <div id="navContent">
  </div>

  <div class="row flex-nowrap">
    <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar d-md-block d-none">
      <!-- <h4>Admin Panel</h4> -->
      <nav id="sidebar d-md-block d-none" class="nav flex-column"></nav>
    </div>

    <div class="col main-content">
      <div class="row mt-md-0">
        <div class="col bg-white p-3 p-md-5 border rounded-3">
        <div class="container mt-4">

  <div class=" align-items-center">
    <h3 class="mb-5 text-center">📘 General Register</h3>
  </div>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addRegisterModal">
      ➕ Add Register
    </button>
  <!-- Search -->
   <div class="row align-items-center">
    <div class="col-md-4">
  <input type="text" id="searchInput" class="form-control my-2" placeholder="🔍 Search register...">

    </div>
    
            <div class="col-md-4 col-6" id="campusSelectBox1"> </div>

    
   </div>


 

  <!-- Table -->
  <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
    <table class="table table-bordered table-hover mt-3 text-nowrap">
      <thead class="table-light sticky-top bg-light">
        <tr>
          <th>#</th>
          <th>Register Name</th>
          <th>Campus</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="registerTableBody"></tbody>
    </table>
  </div>
</div>


<!-- Add/Edit Modal -->
<div class="modal fade" id="addRegisterModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">➕ Add Register</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>


      <div class="modal-body">

        <input type="hidden" id="editId">

        <div class="mb-3">
          <label class="form-label">Register Name</label>
          <input type="text" id="registerName" class="form-control">
        </div>

              <div class="" id="campusSelectBox2"></div>


      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button class="btn btn-primary" id="saveBtn">💾 Save</button>
      </div>

    </div>
  </div>
</div>


        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container">
  <div class="toast text-white border-0" id="toastMessage" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody">💬 Message</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script src="./generalRegister.js"></script>
<script src="../index.js"></script>
<script src="../dropdown.js"></script>

</body>
</html>
