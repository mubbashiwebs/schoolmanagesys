  <!DOCTYPE html>
  <html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Teacher Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="../index.css" />
     <style>
   
  </style>
  </head>

  <body>
    <!-- Spinner HTML -->
<div id="loader" class="loader-overlay">
  <div class="spinner"></div>
</div>
    <div class="container-fluid px-0">
        <div id="navContent"></div>

      <div class="row flex-nowrap">
        <!-- sidebar d-md-block d-none -->
        <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 d-md-block d-none sidebar d-md-block d-none sticky-top">
          <h4>Admin Panel</h4>
          <nav id="sidebar d-md-block d-none" class="nav flex-column">
        
          </nav>
        </div>

        <!-- Main Content -->
              <div class="col  main-content  ">
        
      <div class="form-container">
    <div class="card border-0 shadow-sm rounded-4 p-4">
      <h2 class="text-center mb-4"> 👨🏻‍🏫 Teacher Admission Form</h2>

      <!-- Tabs navigation -->
      <ul class="nav nav-tabs" id="admissionTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="image-tab" data-bs-toggle="tab" data-bs-target="#image" type="button"> 📷
            Image
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="personal-tab" data-bs-toggle="tab" data-bs-target="#personal" type="button">🧍
            Personal </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="qualification-tab" data-bs-toggle="tab" data-bs-target="#qualification"
            type="button"> 🎓 Qualification
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="admission-tab" data-bs-toggle="tab" data-bs-target="#admission" type="button"> 📝
            Admission
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="fee-tab" data-bs-toggle="tab" data-bs-target="#salary" type="button"> 💵 Fee
          </button>
        </li>
      </ul>

      <form id="admissionForm">
        <div class="tab-content">

          <!-- Tab 1: Image -->
          <div class="tab-pane fade show active" id="image" role="tabpanel">
            <div class="row align-items-center mt-4">
              <div class="col-12 text-center mb-3">
                <label for="teacherImage" >
                  <img src="../upload_area.png" id="imgPreview"  class="square-box" alt="">
                  <!-- <i class="fas fa-upload"></i> -->
                </label>
                 <input type="file" name="teacherImage" id="teacherImage" accept="image/*" />
                <!-- <p class="mt-2">Click to upload image</p> -->
              </div>
              <!-- <div class="col-md-6 col-sm-12 text-center"> -->
                <!-- <img id="imgPreview" src="../demostdimg.jpg" alt="Student Image" class="preview-img mb-3"> -->
                <div class="d-flex justify-content-center gap-2">
                </div>
              <!-- </div> -->
            </div>
            <button type="button" class="btn bg-white shadow-sm border btn-next mt-3 float-end">Next ➡️</button>
          </div>

          <!-- Tab 2: Personal -->
          <div class="tab-pane fade" id="personal" role="tabpanel">
            <div class="row g-3 mt-3">
              <div class="col-md-6">
                <label class="form-label">👤 Name</label>
                <input type="text" class="form-control" name="name" placeholder="Enter Name" >
              </div>
              <div class="col-md-6">
                <label class="form-label"> 👨‍👦 Father Name</label>
                <input type="text" class="form-control" name="fatherName" placeholder="Enter Father Name" >
              </div>
              <div class="col-md-6">
                <label class="form-label"> 🪪 CNIC</label>
                <input type="text" class="form-control" name="cnic" placeholder="Enter CNIC" >
              </div>
              <div class="col-md-6">
                <label class="form-label"> 🎂 DOB</label>
                <input type="date" class="form-control" name="dob" placeholder="Select Date of Birth" >
              </div>
              <div class="col-md-6">
                <label class="form-label"> 📞 Contact</label>
                <input type="text" class="form-control" name="phone" placeholder="Enter Contact Number" >
              </div>
              <div class="col-md-6">
                <label class="form-label"> 📧 Email</label>
                <input type="email" class="form-control" name="email" placeholder="Enter Email">
              </div>
              <div class="col-md-6">
                <label class="form-label"> 🚻 Gender</label>
                <select class="form-control" name="gender">
                  <option value="">Select Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label"> 📍 Address</label>
                <textarea class="form-control" name="address" rows="2" placeholder="Enter Address"></textarea>
              </div>
            </div>
            <button type="button" class="btn bg-white shadow-sm border btn-next mt-3 float-end">Next ➡️</button>
          </div>

          <!-- Tab 3: Qualification -->
          <div class="tab-pane fade" id="qualification" role="tabpanel">
            <div class="row g-3 mt-3">
              <div class="col-md-6">
                <label class="form-label"> 🎓 Last Qualification</label>
                <input type="text" class="form-control" name="lastQualification" placeholder="Enter Last Qualification"
                  >
              </div>
              <div class="col-md-6">
                <label class="form-label">🏫 Last School</label>
                <input type="text" class="form-control" name="lastSchool" placeholder="Enter Last School Name" >
              </div>
            </div>
            <button type="button" class="btn bg-white shadow-sm border btn-next mt-3 float-end">Next ➡️</button>
          </div>

          <!-- Tab 4: Admission -->
          <div class="tab-pane fade" id="admission" role="tabpanel">
            <div class="row g-3 mt-3 align-items-center">

              <div class="col-md-6">
                  <label> 📅 Joining Date</label>
                    <input type="date" name="joiningDate" class="form-control" />
              </div>
              <div class="col-md-6" id="campusDropdownField"></div>

                       <div class="col-md-3">
                    <br>
                    <label for=""> ⭐ Role</label>
                    <br>
                    <input type="radio" name="role" id="roleTeacher" value="teacher" checked />
                    <label for="roleTeacher">Teacher</label>
                    <input type="radio" name="role" id="roleStaff" value="staff" />

                    <label for="roleStaff">Staff</label>

                    <br>
                    <div class="designationBox" id="designationBox" style="display: none;">
                    <label for="">Designation</label>
                    <input type="text" name="designation" id="designation"  class="form-control" />
                    </div>
                  </div>

              <div class="col-md-3">
                <label class="form-label">✅ Status</label>
                <div>
                  <input type="radio" name="status" id="available" value="active" checked>
                  <label for="available" class="me-3">Active</label>

                  <input type="radio" name="status" id="left" value="left">
                  <label for="left">Left</label>
                </div>

                <div class="mt-2" id="leaveReasonBox" style="display: none;">
                  <label for="leaveReason">📄 Leave Reason</label>
                  <input type="text" name="leftReason" id="leaveReason" class="form-control"
                    placeholder="Enter reason for leaving">
                </div>
              </div>


              <div class="col-6 mt-3">
                <label class="form-label">📚 Select Admission Type</label><br>

                <div class="form-check form-check-inline" id="SchoolTypeField">
                <input class="form-check-input" type="checkbox"  id="typeSchool" value="school"/>
                <label class="form-check-label" for="typeSchool">🏫 School</label>
              </div>

                              <div class="form-check form-check-inline" id="CompTypeField">
                <input class="form-check-input" type="checkbox" id="typeComputer" value="computer"/>
                <label class="form-check-label" for="typeComputer">💻 Computer</label>
              </div>

          <div class="form-check form-check-inline" id="EngTypeField">
                <input class="form-check-input" type="checkbox" id="typeEnglish" value="english"/>
                <label class="form-check-label" for="typeEnglish">🗣️ English</label>
              </div>

                <div class="form-check form-check-inline" id="TuitionTypeField">
                <input class="form-check-input" type="checkbox" id="typeTuition" value="tuition"/>
                <label class="form-check-label" for="typeTuition">📘 Tuition</label>
              </div>
              </div>

              <!-- Dynamic fields -->
              <div class="row g-3 mt-3" id="classSectionFields" style="display: none;">
                <div class="col-md-6">
                  <label>🏷️ Admission Class</label>
                  <select name="class" id="admissionClass" class="form-select">
                    <option value="">Select Class</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label>🗂️ Admission Section</label>
                  <select name="section" id="admissionSection" class="form-select">
                    <option value="">Select Section</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label>📘 Current Class</label>
                  <select name="class" id="currentClass" class="form-select">
                    <option value="">Select Current Class</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label>🗂️ Current Section</label>
                  <select name="section" id="currentSection" class="form-select">
                    <option value="">Select Current Section</option>
                  </select>
                </div>
              </div>

              <div class="row g-3 mt-3" id="tuitionFields" style="display: none;">
                <div class="col-md-6">
                  <label>📗 Tuition Class</label>
                  <select name="tuitionClass" id="tuitionClass" class="form-select">
                    <option value="">Select Tuition Class</option>
                  </select>
                </div>
              </div>

              <div class="mt-3" id="computerCourseField" style="display: none;">
                <label>💻 Computer Course</label>
                <select name="computerCourse" id="computerCourse" class="form-select">
                  <option value="">Select Course</option>
                </select>
                <br>
                <label>🕒 Batch</label>
                <select name="computerCourseBatch" id="computerCourseBatch" class="form-select">
                  <option value="">Select Batch</option>
                </select>
              </div>

              <div class="mt-3" id="engCourseField" style="display: none;">
                <label>🗣️ English Course</label>
                <select name="englishCourse" id="englishCourse" class="form-select">
                  <option value="">Select Course</option>
                </select>
                <br>
                <label>🕒 Batch</label>
                <select name="engCourseBatch" id="engCourseBatch" class="form-select">
                  <option value="">Select Batch</option>
                </select>
              </div>
            </div>

            <button type="button" class="btn bg-white shadow-sm border btn-next mt-3 float-end">Next ➡️</button>
          </div>


          <!-- Tab 5: Fee -->
          <div class="tab-pane fade" id="salary" role="tabpanel">
            <div class="row g-3 mt-3">
              <div class="col">

                <h5 class="mb-3">🧾 Salary Info</h5>
                <label class="fw-bold">💰 Salary Amount:</label>

                <input type="number" placeholder="Enter Salary Amount" name="Salary" class="form-control" required />
              </div>



              </div>
               <button type="submit" class="btn border shadow-sm  mt-5 float-end"> 🚀 Submit
              </button>

            </div>
           
              
          </div>
      </form>
    </div>
  </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- JS Logic -->
<script src="./teacher.js"></script>
    <script src="../index.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>

  </html>
