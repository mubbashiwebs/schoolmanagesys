<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Verification</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    .copy-btn {
      cursor: pointer;
    }
    .card {
      max-width: 500px;
      margin: auto;
      margin-top: 80px;
    }
    .success-icon {
      font-size: 40px;
      color: green;
    }
    .error-icon {
      font-size: 40px;
      color: red;
    }
.loader-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.8);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Spinner animation */
.spinner {
  width: 50px;
  height: 50px;
  border: 6px solid #ccc;
  border-top-color: #3498db;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
  </style>
</head>
<body>
    <!-- Spinner HTML -->
<div id="loader" class="loader-overlay">
  <div class="spinner"></div>
</div>


  <!-- Card -->
  <div id="card-container" class="card shadow-sm p-4 text-center d-none">
    <div id="icon"></div>
    <h4 id="card-title" class="mt-3"></h4>
    <p id="card-message" class="text-muted"></p>

    <div id="userIdContainer" class="mt-3 d-none">
      <div class="input-group">
        <input type="text" id="userId" class="form-control" readonly />
        <button class="btn btn-outline-secondary copy-btn" onclick="copyUserId()">Copy</button>
      </div>
    </div>

    <div class="mt-4">
      <a href="#" id="action-link" class="btn btn-primary"></a>
    </div>
  </div>

  <!-- Toast -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="toast" class="toast align-items-center text-white bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toast-message"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>


<script src="./verify.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
