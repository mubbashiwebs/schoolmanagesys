<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📋 Student List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../index.css">
</head>

<style>
  body {
    background: #f8f9fb;
    font-family: "Segoe UI", sans-serif;
  }

  h2 {
    font-weight: 600;
    color: #222;
  }

  .card {
    border-radius: 16px;
    border: none;
  }

  .filters input, 
  .filters select {
    padding: 10px 14px;
    border-radius: 8px !important;
    border: 1px solid #ccc !important;
    font-size: 14px;
    background: white;
  }

  /* .filters {
    display: flex !important;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  } */

  .table {
    border-radius: 12px;
    overflow: hidden;
    font-size: 14px;
  }

  .table thead {
    background: #f1f3f5;
    font-weight: 600;
  }

  .table tbody tr:hover {
    background: #f7faff;
    transition: 0.2s ease-in-out;
  }

  #exportBtn {
    /* background: #4caf50; */
    background-color: white;
    /* border:1px !important; */
    border-color: #43a047 !important;
    color: black;
    /* border: none; */
    padding: 8px 14px;
    border-radius: 8px;
    margin-bottom: 10px;
    width: 200px;
  }

  #exportBtn:hover {
    background: #43a047;
    color: white;
  }
</style>

<body>
  <div class="container-fluid px-0">
    <div id="navContent"></div>

    <div class="row flex-nowrap">
      
      <!-- sidebar d-md-block d-none -->
      <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar d-md-block d-none">
        <h4 class="text-center mt-3">⚙️ Admin Panel</h4>
        <nav id="sidebar d-md-block d-none" class="nav flex-column"></nav>
      </div>

      <!-- Main Content -->
      <div class="col main-content">

        <div class="card bg-white mt-4 p-5 shadow-sm">
          
          <h2 class="text-center mb-4">📋 Student Data List</h2>

          <!-- Admission Type Filters -->
          <div class="mb-3">
            <label class="form-label fw-bold">🎯 Select Admission Types:</label><br />

            <div id="admissionTypeContainer">
<div class="form-check form-check-inline" id="SchoolTypeField">
                <input class="form-check-input" type="checkbox"  id="typeSchool" value="school"/>
                <label class="form-check-label" for="typeSchool">🏫 School</label>
              </div>

                              <div class="form-check form-check-inline" id="CompTypeField">
                <input class="form-check-input" type="checkbox" id="typeComputer" value="computer"/>
                <label class="form-check-label" for="typeComputer">💻 Computer</label>
              </div>

          <div class="form-check form-check-inline" id="EngTypeField">
                <input class="form-check-input" type="checkbox" id="typeEnglish" value="english"/>
                <label class="form-check-label" for="typeEnglish">🗣️ English</label>
              </div>

                <div class="form-check form-check-inline" id="TuitionTypeField">
                <input class="form-check-input" type="checkbox" id="typeTuition" value="tuition"/>
                <label class="form-check-label" for="typeTuition">📘 Tuition</label>
              </div>
            </div>
          </div>

          <!-- Filters Section -->
 <div class="filters row g-1">
  <div class="col-12  col-md-3">
    <input type="text" id="searchInput" class="form-controls" placeholder="🔍 Search by ID / Name / Class / Section / Campus / Role" style="display:none;">
  </div>

  <div class="col-6 col-sm-6 col-md-3">
    <select id="campusSelect" class="form-select" style="display:none;">
      <option value="">🏫 All Campuses</option>
    </select>
  </div>

  <div class="col-6 col-sm-6 col-md-3">
    <select id="classSelect" class="form-select" style="display:none;">
      <option value="">🎓 All Classes</option>
    </select>
  </div>

  <div class="col-6 col-sm-6 col-md-3">
    <select id="sectionSelect" class="form-select" style="display:none;">
      <option value="">🧩 All Sections</option>
    </select>
  </div>

  <div class="col-6 col-sm-6 col-md-3">
    <select id="computerCourseSelect" class="form-select" style="display:none;">
      <option value="">💻 All Computer Courses</option>
    </select>
  </div>

  <div class="col-6 col-sm-6 col-md-3">
    <select id="computerBatchSelect" class="form-select" style="display:none;">
      <option value="">📅 All Computer Batches</option>
    </select>
  </div>

  <div class="col-6 col-sm-6 col-md-3">
    <select id="englishCourseSelect" class="form-select" style="display:none;">
      <option value="">🗣️ All English Courses</option>
    </select>
  </div>

  <div class="col-6 col-sm-6 col-md-3">
    <select id="englishBatchSelect" class="form-select" style="display:none;">
      <option value="">📅 All English Batches</option>
    </select>
  </div>
    
    <div class="col-6 col-sm-6 col-md-3">
    <select id="statusSelect" class="form-select" >
      <option value="">Status</option>
      <option value="">All</option>
      <option selected value="Active">Active</option>
      <option value="Left">Left</option>
    </select>
  </div>

</div>
  
          <!-- Export -->
          <button id="exportBtn">📤 Export to Excel</button>

          <!-- Modern Responsive Table -->
          <div class="table-responsive" style="max-height: 600px; overflow: auto;">
            <table class="table  table-hover align-middle" id="myTable">
              <thead class="sticky-top" id="tableHead">
                <tr>
                  <td>S.No</td>
                  <th>🆔 Master ID</th>
                  <th>🔢 GR No</th>
                  <th>📘 Class</th>
                  <th>🗂️ Section</th>
                  <th>🎓 Admission Type</th>
                  <th>⚙️ Actions</th>
                </tr>
              </thead>
              <tbody id="studentTableBody"></tbody>
            </table>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="../Students/studentlist.js"></script>
  <script src="../index.js"></script>
</body>
</html>
