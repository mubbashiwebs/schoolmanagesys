<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Leisure Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .table-summary th {
      background-color: #212529;
      color: white;
    }

    .highlight {
      background-color: #f9f9f9;
    }
  </style>
</head>

<body class="bg-light">

  <div class="container my-5">
    <div class="card shadow p-4">
      <h3 class="text-center mb-4">📘 Student Leisure Report</h3>

      <!-- Form -->
      <form id="reportForm">
        <div class="row g-3">
          <div class="col-md-2">
            <label class="form-label">GR No</label>
            <input type="text" id="grNo" placeholder="Enter student grno" class="form-control" required />
          </div>
          <div class="col-md-2">
            <label class="form-label">Fee Type</label>
            <select id="feeType" class="form-select" required>
              <option value="">Select</option>
              <option value="school">School</option>
              <option value="tuition">Tuition</option>
              <option value="computer">Computer</option>
            </select>
          </div>

          <div class="col-md-2">
            <div class="text-center mt-4">
              <button type="submit" class="btn btn-primary px-4">Get Report</button>
            </div>
          </div>
        </div>


      </form>
    </div>

    <!-- Result Section -->
    <div id="reportResult" class="mt-5" style="display:none;">
      <div class="card shadow p-4">
        <h4 class="mb-3 text-primary">👨‍🎓 Student Information</h4>
        <div id="studentInfo" class="mb-4"></div>

        <h5 class="text-success mb-3">📊 Monthly Leisure Report</h5>
        <div class="table-responsive">
          <table class="table table-bordered table-striped table-summary">
            <thead>
              <tr>
                <th>#</th>
                <th>Month</th>
                <th>Voucher Due Date</th>
                <th>Voucher Amount</th>
                <th>Late Fee</th>
                <th>Receipt Amount</th>
                <th>Receipt Paid Date</th>
                <th>Paid Amount</th>
                <th>Balance</th>
              </tr>
            </thead>
            <tbody id="reportTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
