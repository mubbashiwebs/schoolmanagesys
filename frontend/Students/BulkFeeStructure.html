<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bulk Fee Structure</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f4f6f9;
  padding: 20px;
}

.container {
  background: #fff;
  padding: 25px;
  max-width: 1000px;
  margin: auto;
  border-radius: 8px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

h2 {
  margin-bottom: 20px;
}

/* Input Row */
.row {
  display: flex;
  gap: 15px;
  align-items: center;
  margin-bottom: 20px;
}

.form-group {
  flex: 1;
}

label {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
  display: block;
}

/* Inputs */
select {
  width: 100%;
  height: 42px;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid #ced4da;
  font-size: 14px;
}

select:focus {
  outline: none;
  border-color: #0d6efd;
  box-shadow: 0 0 0 2px rgba(13,110,253,.15);
}

/* Button */
.action-btn {
  height: 42px;
  padding: 0 20px;
  border-radius: 6px;
  background: #198754;
  color: #fff;
  border: none;
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
}

.action-btn:hover {
  background: #157347;
}

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
}

table th, table td {
  border: 1px solid #dee2e6;
  padding: 10px;
  font-size: 14px;
}

table th {
  background:black;
  color: white;
}

tbody tr:hover {
  background: #f8f9fa;
}
.s-cell {
  background-color: green;
    color: white;
    display: none;
}
</style>
</head>

<body>

<div class="container">
  <h2>
    <i class="fa-solid fa-right-left"></i>
    Bulk Student Fee Structure Update
  </h2>

  <!-- Dropdowns + Button -->
  <div class="row">

    <div class="form" id="campusWrap">
      
      <div id="campusSelectBox2"></div>
    </div>

    <div class="form-group">
      <label>
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
           Class
      </label>
      <select id="Class">
        <option value="">Select Class</option>
      </select>
    </div>

    
    <div class="form-group">
      <label>
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
           Section
      </label>
      <select id="section">
        <option value="">Select Section</option>
        <option value="All">All</option>

      </select>
    </div>
 
    <div class="form-group">
      <label>
        <i class="fa-solid fa-rotate"></i>
        Fee Structure
      </label>
      <select id="feeStr">
        <option value="">Select Fee Structure</option>
      </select>
    </div>

    <button class="action-btn" id="updateButton">
      <i class="fa-solid fa-arrows-rotate"></i>
      Update 
    </button>
  </div>

  <!-- Student Table -->
  <table>
    <thead>
      <tr>

        <th width="50">
          <input type="checkbox" id="selectAll">
        </th>
<th><i class="fa-solid fa-list-ol"></i> S.No</th>

        <th><i class="fa-solid fa-user"></i> Name</th>
        <th><i class="fa-solid fa-id-card"></i> GR No</th>
        <th><i class="fa-solid fa-chalkboard-user"></i> Class</th>
   <th><i class="fa-solid fa-money-bill-wave"></i> Class Fee</th>
<th><i class="fa-solid fa-percent"></i> Discount</th>
           <th><i class="fa-solid fa-money-bill-wave"></i>  Net Fee</th>
<th><i class="fa-solid fa-money-bill-wave"></i> Fee Str</th>
          
      </tr>
    </thead>
    <tbody id="studentBody"></tbody>
  </table>
</div>

<script>
    var currentPage = null
      const user = JSON.parse(localStorage.getItem("userData")) || [];
      console.log(user)
  const isSuperAdmin = user[0]?.designation === "supremeadmin";

</script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src ="../global.js"></script>

<script src="./bulkfeeStructure.js"></script>
<script src="../dropdown.js"></script>
</body>
</html>
