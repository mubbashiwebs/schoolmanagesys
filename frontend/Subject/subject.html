<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Dashboard - Subject Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../index.css">
  <style>
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1055;
    }
  </style>
</head>
<body>
  <div class="container-fluid px-0">
    <div id="navContent"></div>

    <div class="row flex-nowrap">
      <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar d-md-block d-none">
        <h4>🛠️ Admin Panel</h4>
        <nav id="sidebar d-md-block d-none" class="nav flex-column"></nav>
      </div>

      <div class="col main-content">
        <div class="row">
          <div class="col bg-white p-md-5 p-3 mb-5 border rounded-3">
            <h2 class="mb-5 text-center">📖 Subject Form</h2>

            <div class="row align-items-center gy-3">
              <div class="col-md-3 col-12">
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#subjectModal">
                  ➕ Add New Subject
                </button>
              </div>
              <div class="col-md-3 col-6">
                <label for="searchSubject">🔍 Enter Name</label>
                <input type="text" class="form-control minimalist-input" placeholder="Search by Subject Name" id="searchSubject">
              </div>
              <div class="col-md-3 col-6" id="campusSelectBox1"></div>
            </div>

            <div class="table-responsive mt-3">
              <table class="table table-bordered table-hover" id="subjectTable">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>📘 Subject Name</th>
                    <th id="adminth" style="display: none;">🏫 Campus</th>
                    <th>⚙️ Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="subjectModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="subjectForm">
          <div class="modal-header">
            <h5 class="subjectModalLabel" id="subjectModalLabel">➕ Add New Subject</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">📘 Subject Name</label>
              <input type="text" class="form-control minimalist-input" id="subjectName" placeholder="Enter subject name" required>
            </div>
            <div>
              <div id="campusSelectBox2"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-dark" id="addSubjectButton">✅ Add Subject</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container">
    <div class="toast text-white border-0" id="toastMessage">
      <div class="d-flex">
        <div class="toast-body" id="toastBody">Message</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Buttons me emoji add karne ke liye JS part (subject.js me ya yahan dono me same kar sakte ho) -->


  <script src="./subject.js"></script>
  <script src="../index.js"></script>
  <script src="../dropdown.js"></script>
</body>
</html>
