<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Dashboard - Section Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../index.css">
  <style>
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1055;
    }
    .minimalist-input {
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: none;
      font-size: 0.95rem;
      padding: 10px;
      transition: all 0.2s ease-in-out;
    }

    .minimalist-input:focus {
      border-color: #000;
      box-shadow: none; /* Removes Bootstrap outline */
    }

    .modal-content {
      background: #fff;
    }

    .modal-header,
    .modal-footer {
      background: #f9f9f9;
    }

    .btn-dark {
      background-color: #000;
      border: none;
      border-radius: 8px;
    }

    .btn-dark:hover {
      background-color: #333;
    }
  </style>
</head>

<body>
  <div class="container-fluid ">
        <div id="navContent"></div>

    <div class="row flex-nowrap">
      <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar d-md-block d-none">
        <h4>🧑‍💼 Admin Panel</h4>
        <nav id="sidebar d-md-block d-none" class="nav flex-column"></nav>
      </div>

       <div class="col main-content ">
        
        <div class="row ">

          <div class="col bg-white p-md-5 py-4 mb-5 border rounded-3">
            
            <h2 class="mb-5 text-center ">📖 Section Form</h2>

            <div class="row align-items-center gy-3">
              <div class="col-md-3 col-12">
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#sectionModal">➕ Add New Section</button>
              </div>

              <div class="col-md-3 col-6">
                <label for="">🔍 Enter Name</label>
                <input type="text" class="form-control" placeholder="🔎 Search by Section Name" id="searchSection">
              </div>

              <div class="col-md-3 col-6" id="campusSelectBox1">
              </div>
            </div>

            <div class="table-responsive mt-3" style="max-height: 600px; overflow-y: auto;">
              <table class="table align-middle table-hover" id="sectionTable">
                <thead class="table-light">
                  <tr>
                    <th>#️⃣</th>
                    <th>🏫 Section Name</th>
                    <th id="adminth" style="display: none;">🏢 Campus</th>
                    <th>⚙️ Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="sectionModal" tabindex="-1" aria-labelledby="sectionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="sectionForm">
          <div class="modal-header">
            <h5 class="modal-title" id="sectionModalLabel">🆕 Add New Section</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="campusSelectBox2"></div>
            <div class="mb-3">
              <label class="form-label">🏫 Section Name</label>
              <input type="text" class="minimalist-input form-control" id="sectionName" placeholder="✏️ Enter section name" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-dark" id="formSubmitBtn">✅ Add Section</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container">
    <div class="toast text-white border-0" id="toastMessage" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastBody">💬 Message</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../global.js"></script>
  <script src="section.js"></script>
  <script src="../index.js"></script>
  <script src="../dropdown.js"></script>
</body>

</html>
