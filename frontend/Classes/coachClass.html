<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard- Coaching Class form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../index.css">
    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

    <style>
       .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1055;
    }
    </style>
</head>

<body>
  
  <div class="container-fluid ">

    <div class="row " id="navContent"></div>

    <div class="row flex-nowrap">
      <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar d-md-block d-none">
        <nav id="sidebar d-md-block d-none" class="nav flex-column"></nav>
      </div>

      <div class="col main-content">
        <div class="row mt-md-0">
          <div class="col col-12 bg-white p-5 border rounded-3">

            <h2 class="mb-5 text-center">📚 Add Coaching Class</h2>

           

            <div class="row align-items-center">
              <div class="col-md-3 col-12">

            <button class="btn btn-success " data-bs-toggle="modal" data-bs-target="#addClassModal">
              ➕ Add New Class
            </button>

              </div>
              <div class="col-md-3 col-6">
                <label>🔍 Enter Name</label>
                <input type="text" class="form-control" placeholder="Search by Class Name" id="searchClass">
              </div>

              <div class="col-md-3 col-6" id="campusSelectBox1"></div>
            </div>

            <div class="table-responsive mt-3" style="max-height: 600px; overflow-y: auto;">
              <table class="table table-bordered table-hover" id="classTable">
                <thead class="table-light">
                  <tr>
                    <th>#️⃣</th>
                    <th>🏷 Class Name</th>
                    <th>💰 Class Fee</th>
                    <th>🧾 Admission Fee</th>
                    <th id="adminth" style="display: none;">🏫 Campus</th>
                    <th>⚙ Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>

            <!-- PAGINATION ADDED HERE -->
            <nav aria-label="Page navigation example" class="mt-3">
              <ul class="pagination justify-content-center" id="pagination"></ul>
            </nav>
            <!-- END PAGINATION -->

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Form -->
<div class="modal fade" id="addClassModal" tabindex="-1" aria-labelledby="addClassModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-sm border-0 rounded-3" style="width: 100%; max-width: 600px; margin: auto;">
      <form id="classForm">

        <div class="modal-header border-0">
          <h5 class="modal-title fw-semibold" id="addClassModalLabel">➕ Add New Class</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div id="campusDropdownContainer" class="mb-3"></div>

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small">🏷 Class Name</label>
              <input type="text" class="form-control" id="className" placeholder="Enter class name" required>
            </div>

            <div class="col-md-6">
              <label class="form-label small">💰 Class Fee</label>
              <input type="number" class="form-control" id="classFee" placeholder="Enter class fee" required>
            </div>
          </div>

          <div class="row mt-2">
            <div class="col-md-6">
              <label class="form-label small">🧾 Admission Fee</label>
              <input type="number" class="form-control" id="admissionFee" placeholder="Enter admission fee" required>
            </div>

            <div class="col-md-6">
              <div id="campusSelectBox2"></div>
            </div>
          </div>

        </div>

        <div class="modal-footer border-0">
          <button type="submit" class="btn btn-dark px-4" id="formSubmitBtn">💾 Save Class</button>
        </div>
      </form>
    </div>
  </div>
</div>

  <!-- Toast -->
  <div class="toast-container">
    <div class="toast text-white border-0" id="toastMessage" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastBody">Message</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../global.js"></script>
<script src="./coachClass.js"></script>
<script src="../index.js"></script>
<script src="../dropdown.js"></script>

</body>
</html>
