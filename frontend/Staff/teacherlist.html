<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student List 📋</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../index.css">
</head>
<style>
     .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: start;
      margin-bottom: 20px;
    }
    input, select {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
</style>
<body>
  <div class="container-fluid px-0">
        <div id="navContent"></div>

    <div class="row flex-nowrap">
      <!-- sidebar d-md-block d-none -->
      <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar d-md-block d-none">
        <h4>Admin Panel 🛠️</h4>
        <nav id="sidebar d-md-block d-none" class="nav flex-column">
         
        </nav>
      </div>

      <!-- Main Content -->
          <div class="col  main-content">
        
        <div class="container bg-white mt-4 p-5">
          <h2 class="mb-5 text-center"> 👩‍🏫👨‍🏫 Teacher Data List </h2>
          
      <div class="filters mt-4">
        <input type="text" id="searchInput" placeholder="🔍 Search by ID / Name / Class / Section / Campus / Role">
        

        <select id="campusSelect">
          <option value="">🏫 All Campuses</option>
         
        </select>

        <select id="roleSelect">
          <option value="">🧑‍🤝‍🧑 All Roles</option>
          <option value="teacher">👩‍🏫 Teacher</option>
          <option value="staff">🧑‍💼 Staff</option>
        </select>
      </div>
        <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
  <table class="table table-bordered table-hover table-striped align-middle">
    <thead class="table-light sticky-top">
      <tr>
        <th>👤 Name</th>
        <th>💼 Role</th>
        <th>📋 EmployType</th>
        <th>💰 Salary</th>
        <th id="adminth">🏫 Campus</th>
        <th>⚙️ Actions</th>
      </tr>
    </thead>
    <tbody id="teacherTableBody">
      <!-- Dynamic rows -->
    </tbody>
  </table>
</div>
        </div>
      </div>
    </div>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script src="./teacherlist.js"></script>
  <script src="../index.js"></script>

</body>
</html>
